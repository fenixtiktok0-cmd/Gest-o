<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Plano</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#34D399">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
  :root {
    --bg: #0B0F14;
    --surface: #131A22;
    --surface-2: #1B232D;
    --border: #232C37;
    --text: #E6EDF3;
    --text-muted: #7C8798;
    --ok: #34D399;
    --warn: #FBBF24;
    --danger: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 15% 0%, rgba(52,211,153,0.14), transparent 45%), radial-gradient(circle at 90% 20%, rgba(96,165,250,0.12), transparent 40%), var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0 24px 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    animation: entrarCard .4s ease both;
  }
  @keyframes entrarCard { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .vitrine-wrap {
    margin: 0 -24px 20px;
    padding: 16px 20px 4px;
    background: linear-gradient(180deg, rgba(52,211,153,0.1), transparent);
    border-radius: 16px 16px 0 0;
  }
  .vitrine-titulo { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; font-weight: 600; }
  .vitrine-scroll {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .vitrine-scroll::-webkit-scrollbar { display: none; }
  .vitrine-scroll.autoscroll { animation: rolarVitrine 32s linear infinite; }
  .vitrine-scroll.autoscroll:hover, .vitrine-scroll.autoscroll:active { animation-play-state: paused; }
  @keyframes rolarVitrine {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(-50%)); }
  }
  .poster-item {
    flex-shrink: 0; width: 86px; opacity: 0; transform: translateY(6px) scale(.96);
    animation: entrarPoster .4s ease forwards;
    transition: transform .15s ease;
    cursor: pointer;
  }
  .poster-item img { width: 100%; border-radius: 8px; box-shadow: 0 6px 14px rgba(0,0,0,0.45); display: block; }
  .poster-item:active { transform: scale(0.93); }
  @keyframes entrarPoster { to { opacity: 1; transform: translateY(0) scale(1); } }
  .vitrine-skeleton { display: flex; gap: 8px; }
  .vitrine-skeleton .sk { flex-shrink: 0; width: 86px; height: 129px; border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 25%, #263042 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .conteudo-principal { padding-top: 20px; }
  .mural-avisos { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .mural-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px; }
  .mural-item .titulo { font-weight: 600; margin-bottom: 2px; }
  .mural-item .data { font-size: 10.5px; color: var(--text-muted); margin-bottom: 4px; }
  .logo-cliente { max-width: 140px; max-height: 60px; margin-bottom: 14px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  .linha {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .linha:last-of-type { border-bottom: none; }
  .linha .label { color: var(--text-muted); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .status-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-ok { background: rgba(52,211,153,0.15); color: var(--ok); }
  .status-warn { background: rgba(251,191,36,0.15); color: var(--warn); }
  .status-danger { background: rgba(248,113,113,0.15); color: var(--danger); }
  button, .btn-suporte {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--ok);
    color: #06231A;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    display: block;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .btn-suporte { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  input[type="email"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    box-sizing: border-box;
  }
  .loading { text-align: center; padding: 40px 0; color: var(--text-muted); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading">Carregando...</div>
</div>

<div id="modal-conteudo" onclick="if(event.target===this) fecharDetalheConteudo()" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; max-width:380px; width:100%; overflow:hidden; max-height:85vh; overflow-y:auto;">
    <div style="position:relative;">
      <img id="modal-conteudo-imagem" src="" style="width:100%; display:block; aspect-ratio:16/9; object-fit:cover;">
      <button onclick="fecharDetalheConteudo()" style="position:absolute; top:10px; right:10px; width:32px; height:32px; margin:0; padding:0; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; font-size:16px; border:none;">✕</button>
    </div>
    <div style="padding:18px;">
      <h2 id="modal-conteudo-titulo" style="font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 6px;"></h2>
      <div id="modal-conteudo-meta" style="font-size:12px; color:var(--text-muted); margin-bottom:12px;"></div>
      <p id="modal-conteudo-sinopse" style="font-size:13.5px; line-height:1.6; margin:0; color:var(--text);"></p>
    </div>
  </div>
</div>

<button id="btn-atualizar-flutuante" onclick="location.reload()" title="Atualizar" style="position:fixed; bottom:20px; right:20px; width:48px; height:48px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ok); font-size:20px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; margin:0;">🔄</button>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBaVUpfN03wm2mm_C3sUZhMUZtThb32FSQ",
    authDomain: "gestao-clientes-a1664.firebaseapp.com",
    databaseURL: "https://gestao-clientes-a1664-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gestao-clientes-a1664",
    storageBucket: "gestao-clientes-a1664.firebasestorage.app",
    messagingSenderId: "417549104013",
    appId: "1:417549104013:web:0a753604b6eaf2f65243c4"
  };
  firebase.initializeApp(firebaseConfig);

  const FIREBASE_DB = firebaseConfig.databaseURL;
  const VAPID_KEY = "BB7h2P--2AyZfHmes1ibhzHlWY1DVPFvyWp6r4CIyQrPbDLOS_xx0zteP8SIbH34m2Txx0KLnLu8ZOF6RbSzY8U";
  const TMDB_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI2OTE0ODExYzM0MWY3MTE1YjU0MWM3OWU5MjI1NjZhYiIsIm5iZiI6MTc1MDI5MzYwNC43MDU5OTk5LCJzdWIiOiI2ODUzNWM2NDM2ODE0OTFlYjExYzBiYjAiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.MZRHZb5Xd9SqxNZnluiMfQjIl4CpnWsU56HESNZAf94";

  async function buscarTMDB(caminho) {
    const res = await fetch(`https://api.themoviedb.org/3${caminho}`, {
      headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
    });
    const data = await res.json();
    return (data.results || []).filter(i => i.poster_path).slice(0, 10);
  }

  let itensFilmesGlobal = [];
  let itensSeriesGlobal = [];

  function montarFileiraPosteres(itens, tipo) {
    const postersHtml = itens.map((i, idx) => `
      <div class="poster-item" style="animation-delay:${idx * 0.06}s;" onclick="abrirDetalheConteudo('${tipo}', ${idx})">
        <img src="https://image.tmdb.org/t/p/w200${i.poster_path}" loading="lazy" alt="${(i.title || i.name || '').replace(/"/g,'')}">
      </div>
    `).join('');
    // Duplica a lista uma vez — é o que permite a rolagem automática dar
    // a volta e continuar de forma contínua, sem "pulo" visível.
    return postersHtml + postersHtml;
  }

  function abrirDetalheConteudo(tipo, idx) {
    const item = (tipo === 'filme' ? itensFilmesGlobal : itensSeriesGlobal)[idx];
    if (!item) return;

    const titulo = item.title || item.name || 'Sem título';
    const data = item.release_date || item.first_air_date;
    const ano = data ? new Date(data + 'T12:00:00').getFullYear() : '';
    const nota = item.vote_average ? item.vote_average.toFixed(1) : null;
    const sinopse = item.overview || 'Sem sinopse disponível.';
    const backdrop = item.backdrop_path
      ? `https://image.tmdb.org/t/p/w780${item.backdrop_path}`
      : `https://image.tmdb.org/t/p/w500${item.poster_path}`;

    document.getElementById('modal-conteudo-imagem').src = backdrop;
    document.getElementById('modal-conteudo-titulo').textContent = titulo;
    document.getElementById('modal-conteudo-meta').textContent = [
      ano,
      tipo === 'filme' ? 'Filme' : 'Série',
      nota ? `⭐ ${nota}` : null,
    ].filter(Boolean).join(' · ');
    document.getElementById('modal-conteudo-sinopse').textContent = sinopse;
    document.getElementById('modal-conteudo').style.display = 'flex';
  }
  function fecharDetalheConteudo() {
    document.getElementById('modal-conteudo').style.display = 'none';
  }

  async function carregarVitrineTMDB() {
    const containerFilmes = document.getElementById('vitrine-filmes');
    const containerSeries = document.getElementById('vitrine-series');
    if (!containerFilmes || !containerSeries) return;

    try {
      const [filmes, series] = await Promise.all([
        buscarTMDB('/trending/movie/week?language=pt-BR'),
        buscarTMDB('/trending/tv/week?language=pt-BR'),
      ]);

      if (filmes.length === 0 && series.length === 0) throw new Error('sem resultados');

      itensFilmesGlobal = filmes;
      itensSeriesGlobal = series;

      containerFilmes.innerHTML = montarFileiraPosteres(filmes, 'filme');
      containerFilmes.classList.add('autoscroll');

      containerSeries.innerHTML = montarFileiraPosteres(series, 'serie');
      containerSeries.classList.add('autoscroll');
      containerSeries.style.animationDirection = 'reverse';
      containerSeries.style.animationDuration = '38s';
    } catch (err) {
      document.getElementById('vitrine-wrap-el')?.remove();
    }
  }

  const params = new URLSearchParams(window.location.search);
  const clienteId = params.get('id');
  let nomeClienteGlobal = '';
  let whatsappAdminGlobal = '';
  let emTesteGlobal = false;

  function extrairIdYoutube(url) {
    if (!url) return null;
    const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : null;
  }

  // Detecta se a página está aberta dentro do navegador embutido de apps
  // como WhatsApp, Instagram e Facebook — esses navegadores não suportam
  // notificação push, então avisamos o cliente a abrir no navegador de
  // verdade em vez de deixar ele tomar um erro genérico confuso.
  function detectarNavegadorEmbutido() {
    const ua = navigator.userAgent || '';
    return /WhatsApp|FBAN|FBAV|Instagram|Line\//i.test(ua);
  }

  function mostrarAvisoNavegadorEmbutido() {
    const card = document.getElementById('card');
    const avisoHtml = `
      <div id="aviso-navegador-embutido" style="background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.4); border-radius:10px; padding:14px; margin-top:16px;">
        <div style="font-weight:600; font-size:14px; margin-bottom:8px; color:var(--warn);">⚠️ Abre esse link no navegador de verdade</div>
        <p style="font-size:13px; margin:0 0 10px; line-height:1.5;">Você está vendo essa página dentro de um app (WhatsApp, Instagram, etc.) — esses apps não deixam ativar notificação. Segue o passo a passo:</p>
        <ol style="margin:0; padding-left:18px; font-size:13px; line-height:1.7;">
          <li>Toca nos <b>três pontinhos (⋮)</b> ou no ícone de compartilhar, aqui em cima da tela</li>
          <li>Escolhe <b>"Abrir no navegador"</b> (ou "Abrir no Chrome" / "Abrir no Safari")</li>
          <li>A página abre de novo, só que no navegador de verdade — aí sim clica pra ativar</li>
        </ol>
      </div>
    `;
    const existente = document.getElementById('aviso-navegador-embutido');
    if (existente) existente.remove();
    card.insertAdjacentHTML('beforeend', avisoHtml);
  }

  async function carregar() {
    const card = document.getElementById('card');
    if (!clienteId) {
      card.innerHTML = '<div class="loading">Link inválido.</div>';
      return;
    }

    const [clienteRes, configRes, appsRes, servidoresRes, avisosRes] = await Promise.all([
      fetch(`${FIREBASE_DB}/clientes/${clienteId}.json`),
      fetch(`${FIREBASE_DB}/config.json`),
      fetch(`${FIREBASE_DB}/aplicativos.json`),
      fetch(`${FIREBASE_DB}/servidores.json`),
      fetch(`${FIREBASE_DB}/avisos.json`)
    ]);
    const c = await clienteRes.json();
    const config = await configRes.json() || {};
    const appsData = await appsRes.json() || {};
    const apps = Object.entries(appsData).map(([id, a]) => ({ id, ...a }));
    const servidoresData = await servidoresRes.json() || {};
    const servidoresList = Object.values(servidoresData);
    const avisosData = await avisosRes.json() || {};
    const avisosList = Object.values(avisosData).sort((a, b) => b.criadoEm - a.criadoEm).slice(0, 3);

    if (!c) {
      card.innerHTML = '<div class="loading">Cliente não encontrado.</div>';
      return;
    }

    const marca = config.marca || {};
    const corPrimaria = marca.corPrimaria || '#34D399';
    document.documentElement.style.setProperty('--ok', corPrimaria);

    const logoHtml = marca.logoUrl ? `<img class="logo-cliente" src="${marca.logoUrl}">` : '';
    const textoBotaoNotif = c.origemCaptura
      ? '👉 Clique aqui pra ver seus dados de acesso e ativar as notificações'
      : (marca.textoBotaoNotificacao || '👉 Clique aqui pra ver seus dados de acesso e ativar as notificações');
    const textoBotaoSuporte = marca.textoBotaoSuporte || '💬 Falar com o suporte agora';

    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const venc = new Date(c.vencimento); venc.setHours(0,0,0,0);
    const dias = Math.round((venc - hoje) / (1000*60*60*24));

    let statusTexto, statusClasse, vencimentoTexto;

    if (c.emTeste) {
      const horasRestantes = Math.round((c.vencimento - Date.now()) / (1000*60*60));
      if (horasRestantes <= 0) {
        statusTexto = 'Teste encerrado';
        statusClasse = 'status-danger';
      } else {
        statusTexto = `Teste — restam ${horasRestantes}h`;
        statusClasse = 'status-warn';
      }
      vencimentoTexto = new Date(c.vencimento).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    } else {
      if (dias < 0) { statusTexto = 'Vencido'; statusClasse = 'status-danger'; }
      else if (dias === 0) { statusTexto = 'Vence hoje'; statusClasse = 'status-warn'; }
      else if (dias <= 3) { statusTexto = `Vence em ${dias}d`; statusClasse = 'status-warn'; }
      else { statusTexto = 'Ativo'; statusClasse = 'status-ok'; }
      vencimentoTexto = new Date(c.vencimento).toLocaleDateString('pt-BR');
    }

    const notifAtiva = !!c.notificacaoAtiva;

    const appsDoCliente = (c.aplicativosIds || []).map(id => apps.find(a => a.id === id)).filter(Boolean);
    const temDadosAcesso = c.usuario || c.senha || appsDoCliente.length > 0;

    let dadosAcessoHtml = '';
    let emailCapturaHtml = '';

    if (notifAtiva && temDadosAcesso) {
      const cores = ['#34D399', '#60A5FA', '#F472B6', '#A78BFA', '#FB923C', '#22D3EE'];
      const appsHtml = appsDoCliente.map((app, i) => {
        const cor = cores[i % cores.length];
        return `
          <div style="background:${cor}1a; border:1px solid ${cor}55; border-radius:10px; padding:10px 12px; margin-bottom:8px;">
            <div style="display:flex; align-items:center; gap:6px; color:${cor}; font-weight:600; font-size:14px;">📺 ${app.nome}</div>
            <div class="mono" style="color:${cor}; opacity:0.75; font-size:13px; margin-top:3px;">Código: ${app.codigo}</div>
          </div>
        `;
      }).join('');

      const credenciaisHtml = (c.usuario || c.senha) ? `
        <div style="background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.4); border-radius:10px; padding:10px 12px; margin-top:4px;">
          ${c.usuario ? `<div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;"><span style="color:var(--text-muted);">Usuário</span><span class="mono" style="color:var(--warn); font-weight:600;">${c.usuario}</span></div>` : ''}
          ${c.senha ? `<div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;"><span style="color:var(--text-muted);">Senha</span><span class="mono" style="color:var(--warn); font-weight:600;">${c.senha}</span></div>` : ''}
        </div>
      ` : '';

      dadosAcessoHtml = `
        <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">
          <div style="font-size:12px; color:var(--ok); margin-bottom:8px;">✅ Dados de acesso:</div>
          ${appsHtml}
          ${credenciaisHtml}
        </div>
      `;
    } else if (!notifAtiva && temDadosAcesso) {
      emailCapturaHtml = `
        <div style="margin-top:16px;">
          <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;">Seu e-mail (opcional)</label>
          <input type="email" id="input-email-cliente" value="${c.email || ''}" placeholder="seuemail@exemplo.com">
        </div>
      `;
    }

    nomeClienteGlobal = c.nome;
    whatsappAdminGlobal = config.whatsappAdmin || '';
    emTesteGlobal = !!c.emTeste;

    const botaoSuporteHtml = config.whatsappAdmin
      ? `<a class="btn-suporte" href="https://wa.me/${config.whatsappAdmin}?text=${encodeURIComponent('Olá! Sou o cliente ' + c.nome + ' e preciso de suporte.')}" target="_blank">${textoBotaoSuporte}</a>`
      : '';

    const pagamentoAutomatico = c.emTeste ? !!config.pagamentoAutomaticoTeste : !!config.pagamentoAutomaticoCliente;
    const botaoPagamentoHtml = pagamentoAutomatico
      ? `<button id="btn-pagar" style="margin-top:12px;" onclick="gerarPix()">💳 Pagar e ${c.emTeste ? 'ativar' : 'renovar'} agora</button>`
      : `<button id="btn-pagar" style="margin-top:12px; background:var(--surface-2); color:var(--text); border:1px solid var(--border);" onclick="solicitarPix()">📲 Solicitar PIX</button>`;

    const bannerPagamentoHtml = (notifAtiva && c.planoValor > 0) ? `
      <div style="margin-top:16px; background:linear-gradient(135deg, rgba(52,211,153,0.15), rgba(52,211,153,0.05)); border:1px solid rgba(52,211,153,0.4); border-radius:12px; padding:16px; text-align:center;">
        <div style="font-size:11px; color:var(--ok); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;">💎 Seu valor exclusivo</div>
        <div style="font-size:28px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--ok);">R$ ${Number(c.planoValor).toFixed(2)}<span style="font-size:13px; color:var(--text-muted); font-weight:500;">/mês</span></div>
        ${botaoPagamentoHtml}
      </div>
      <div id="area-pix" style="display:none;"></div>
    ` : '';

    let tutorialHtml = '';
    if (notifAtiva && c.servidor) {
      const servidorInfo = servidoresList.find(s => s.nome === c.servidor);
      const idYoutube = extrairIdYoutube(servidorInfo?.tutorialUrl || '');
      if (idYoutube) {
        tutorialHtml = `
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">📺 Como instalar na sua TV Box, TV Android ou Firestick:</div>
            <div style="position:relative; padding-bottom:56.25%; height:0; border-radius:10px; overflow:hidden;">
              <iframe src="https://www.youtube.com/embed/${idYoutube}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;" allowfullscreen></iframe>
            </div>
          </div>
        `;
      }
    }

    const muralAvisosHtml = avisosList.length > 0 ? `
      <div class="mural-avisos">
        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; font-weight:600;">📢 Novidades</div>
        ${avisosList.map(a => `
          <div class="mural-item">
            <div class="titulo">${a.titulo}</div>
            <div class="data">${new Date(a.criadoEm).toLocaleDateString('pt-BR')}</div>
            <div>${a.mensagem}</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    card.innerHTML = `
      <div class="conteudo-principal" style="padding-top:24px;">
        ${logoHtml}
        <h1>Olá, ${c.nome}</h1>
        <div class="sub">${marca.nome ? `Status do seu plano · ${marca.nome}` : 'Status do seu plano'}</div>
        ${c.servidor ? `<div class="linha"><span class="label">Servidor</span><span class="mono">${c.servidor}</span></div>` : ''}
        <div class="linha"><span class="label">Valor</span><span class="mono">R$ ${Number(c.planoValor||0).toFixed(2)}</span></div>
        <div class="linha"><span class="label">${c.emTeste ? 'Teste termina em' : 'Vencimento'}</span><span class="mono">${vencimentoTexto}</span></div>
        <div class="linha"><span class="label">Situação</span><span class="status-pill ${statusClasse}">${statusTexto}</span></div>
      </div>
      <div class="vitrine-wrap" id="vitrine-wrap-el" style="margin-top:16px;">
        <div class="vitrine-titulo">🎬 Filmes em alta</div>
        <div class="vitrine-scroll" id="vitrine-filmes"><div class="vitrine-skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
        <div class="vitrine-titulo" style="margin-top:14px;">📺 Séries em alta</div>
        <div class="vitrine-scroll" id="vitrine-series"><div class="vitrine-skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
      </div>
      <div class="conteudo-principal" style="padding-top:4px;">
        ${emailCapturaHtml}
        ${dadosAcessoHtml}
        ${tutorialHtml}
        ${bannerPagamentoHtml}
        <button id="btn-notif" ${notifAtiva ? 'disabled' : ''}>${notifAtiva ? 'Notificações ativadas ✓' : textoBotaoNotif}</button>
        ${botaoSuporteHtml}
        ${muralAvisosHtml}
      </div>
    `;

    const botaoNotif = document.getElementById('btn-notif');
    if (botaoNotif && !notifAtiva) botaoNotif.onclick = ativarNotificacoes;
    carregarVitrineTMDB();

    // Se estiver dentro do WhatsApp/Instagram/etc, já avisa de cara,
    // sem esperar o cliente clicar e tomar um erro confuso.
    if (!notifAtiva && detectarNavegadorEmbutido()) {
      mostrarAvisoNavegadorEmbutido();
    }
  }

  async function gerarPix() {
    const btn = document.getElementById('btn-pagar');
    btn.disabled = true;
    btn.textContent = 'Gerando PIX...';

    try {
      const res = await fetch('/api/pix-cliente', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clienteId })
      });
      const data = await res.json();

      if (data.erro) {
        alert('Erro: ' + data.erro);
        btn.disabled = false;
        btn.textContent = '💳 Pagar e ativar agora';
        return;
      }

      const area = document.getElementById('area-pix');
      area.style.display = 'block';
      area.innerHTML = `
        <div id="bloco-qrcode" style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:10px; text-align:center;">
          <img src="data:image/png;base64,${data.qrCodeBase64}" style="width:170px; height:170px; margin:0 auto 12px; display:block; border-radius:8px;">
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">Escaneia o QR Code ou copia o código Pix Copia e Cola</div>
          <textarea readonly rows="3" style="width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:10px; resize:none; box-sizing:border-box;" onclick="this.select()">${data.qrCodeTexto}</textarea>
          <button type="button" style="margin-top:8px; background:var(--surface-2); color:var(--text); border:1px solid var(--border);" onclick="copiarPix()">📋 Copiar código</button>
          <div id="status-verificacao" style="font-size:11.5px; color:var(--text-muted); margin-top:12px;">🔄 Verificando pagamento automaticamente...</div>
        </div>
      `;
      btn.style.display = 'none';

      verificarPagamentoPeriodicamente(data.paymentId);
    } catch (err) {
      alert('Não deu pra gerar o Pix agora. Tenta de novo.');
      btn.disabled = false;
      btn.textContent = '💳 Pagar e ativar agora';
    }
  }

  function verificarPagamentoPeriodicamente(paymentId) {
    const intervalo = setInterval(async () => {
      try {
        const res = await fetch(`/api/pix-cliente?paymentId=${paymentId}`);
        const data = await res.json();
        if (data.status === 'approved') {
          clearInterval(intervalo);
          mostrarBotaoAvisarPagamento();
        }
      } catch (err) {
        // Tenta de novo no próximo ciclo
      }
    }, 5000);
  }

  function mostrarBotaoAvisarPagamento() {
    const bloco = document.getElementById('bloco-qrcode');
    if (!bloco) return;
    bloco.innerHTML = `
      <div style="font-size:32px; margin-bottom:8px;">✅</div>
      <div style="font-weight:700; margin-bottom:4px;">Pagamento identificado!</div>
      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:14px;">Clica no botão abaixo pra avisar e liberar a ativação do seu plano.</div>
      <button type="button" style="background:var(--ok);" onclick="avisarPagamento()">📲 Informar que paguei</button>
      <div style="font-size:11px; color:var(--text-muted); margin-top:10px;">⏱️ ${emTesteGlobal ? 'A ativação pode demorar até 20 minutos' : 'A renovação pode demorar até 1 hora'} depois do envio da mensagem, dependendo da demanda.</div>
    `;
  }

  function solicitarPix() {
    if (!whatsappAdminGlobal) { alert('Não encontrei o WhatsApp de suporte configurado.'); return; }
    const mensagem = `Sou o cliente ${nomeClienteGlobal}, preciso do PIX pra pagar meu plano.`;
    window.open(`https://wa.me/${whatsappAdminGlobal}?text=${encodeURIComponent(mensagem)}`, '_blank');
  }

  function avisarPagamento() {
    if (!whatsappAdminGlobal) { alert('Não encontrei o WhatsApp de suporte configurado.'); return; }
    const mensagem = `Meu pagamento foi confirmado! Sou o cliente ${nomeClienteGlobal}.`;
    window.open(`https://wa.me/${whatsappAdminGlobal}?text=${encodeURIComponent(mensagem)}`, '_blank');
  }

  function copiarPix() {
    const texto = document.querySelector('#area-pix textarea').value;
    navigator.clipboard.writeText(texto).then(() => alert('Código copiado!'));
  }

  async function ativarNotificacoes() {
    const btn = document.getElementById('btn-notif');

    if (detectarNavegadorEmbutido()) {
      mostrarAvisoNavegadorEmbutido();
      return;
    }

    if (!('Notification' in window)) {
      alert('Esse navegador não tem suporte a notificações. Tenta usar o Chrome atualizado.');
      return;
    }

    if (Notification.permission === 'denied') {
      alert('As notificações desse site já estão bloqueadas no seu navegador (provavelmente de uma tentativa anterior). Pra corrigir:\n\n1. Toca no ícone de cadeado/informações ao lado do endereço do site (na barra de cima)\n2. Procura "Notificações" ou "Permissões"\n3. Muda pra "Permitir"\n4. Recarrega essa página e tenta ativar de novo');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Ativando...';

    try {
      const permissao = await Notification.requestPermission();
      if (permissao !== 'granted') {
        alert('Você precisa permitir as notificações no navegador.');
        btn.disabled = false;
        btn.textContent = 'Ativar notificações';
        return;
      }

      const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      const messaging = firebase.messaging();
      const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });

      const inputEmail = document.getElementById('input-email-cliente');
      const emailDigitado = inputEmail ? inputEmail.value.trim() : '';

      const dadosParaSalvar = { fcmToken: token, notificacaoAtiva: true };
      if (emailDigitado) dadosParaSalvar.email = emailDigitado;

      await fetch(`${FIREBASE_DB}/clientes/${clienteId}.json`, {
        method: 'PATCH',
        body: JSON.stringify(dadosParaSalvar)
      });

      await carregar();
    } catch (err) {
      alert('Não deu pra ativar as notificações agora (' + (err.message || 'erro desconhecido') + '). Tenta de novo.');
      btn.disabled = false;
      btn.textContent = 'Ativar notificações';
    }
  }

  carregar();
</script>

</body>
</html>
